<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Forecast</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="weather-bg" id="weatherBg"></div>
    
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cloud-sun"></i> Weather Forecast</h1>
            <p>Get real-time weather information for any city worldwide</p>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input type="text" class="search-input" id="cityInput" placeholder="Enter city name..." autocomplete="off">
                <button class="search-btn" id="searchBtn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <div id="weatherContainer"></div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
